# nginx site per flipper.dxveblud.dev -> relay su 127.0.0.1:8787
#
# Prerequisiti sulla VM:
#   cert:  sudo certbot certonly --nginx -d flipper.dxveblud.dev
#   login: sudo apt install -y apache2-utils
#          sudo htpasswd -cB /etc/nginx/.flipper_htpasswd <utente>
# Installazione:
#   sudo cp deploy/nginx-flipper.conf /etc/nginx/sites-available/flipper
#   sudo ln -sf /etc/nginx/sites-available/flipper /etc/nginx/sites-enabled/flipper
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name flipper.dxveblud.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flipper.dxveblud.dev;

    ssl_certificate     /etc/letsencrypt/live/flipper.dxveblud.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flipper.dxveblud.dev/privkey.pem;

    location = / { return 302 /flipper; }

    # WebSocket: niente login (protetto dal VIEWER_TOKEN dentro la pagina)
    location = /flipper/ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Pagina pannello: login basic auth
    location / {
        auth_basic "Flipper Recon";
        auth_basic_user_file /etc/nginx/.flipper_htpasswd;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
